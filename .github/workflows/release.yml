name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build MSIX
    runs-on: windows-latest

    env:
      PROJECT_PATH: src/WhisperShroom/WhisperShroom/WhisperShroom.csproj
      PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The SDK is pinned in global.json so CI and local builds use the exact same
      # toolchain. Previously this was dotnet-version "10.0.x" + dotnet-quality
      # "preview", which resolved to a release-candidate SDK on the runner while
      # local builds used the GA SDK, so the shipped MSIX was never compiled by the
      # toolchain the change had been tested with.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Import signing certificate
        id: cert_import
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE_BASE64 }}")
          $pfxPath = "src/WhisperShroom/WhisperShroom/WhisperShroom_Dev.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $password = "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}"
          if ($password) {
            $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          } else {
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My
          }

          echo "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Host "Certificate imported with thumbprint: $($cert.Thumbprint)"

      # Locked mode fails the build if the resolved package graph differs from
      # packages.lock.json, rather than silently shipping different versions than
      # were tested locally.
      - name: Restore NuGet packages
        run: dotnet restore ${{ env.PROJECT_PATH }} --locked-mode

      - name: Build signed MSIX
        run: >
          dotnet build ${{ env.PROJECT_PATH }}
          -c Release
          -p:Platform=${{ env.PLATFORM }}
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateThumbprint=${{ steps.cert_import.outputs.thumbprint }}

      - name: Find MSIX artifact
        id: artifact
        shell: bash
        run: |
          MSIX=$(find dist/ -maxdepth 1 -name "WhisperShroom_*.msix" | head -1)
          if [ -z "$MSIX" ]; then
            echo "::error::No MSIX file found in dist/"
            exit 1
          fi
          echo "msix_path=$MSIX" >> "$GITHUB_OUTPUT"
          echo "msix_name=$(basename $MSIX)" >> "$GITHUB_OUTPUT"

      - name: Find certificate
        id: cert
        shell: bash
        run: |
          CER=$(find dist/ -name "*.cer" -type f | head -1)
          if [ -n "$CER" ]; then
            echo "cer_path=$CER" >> "$GITHUB_OUTPUT"
            echo "cer_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "cer_found=false" >> "$GITHUB_OUTPUT"
          fi

      # The symbol package stays in the versioned subfolder; only the .msix is copied to
      # the dist/ root. Treated as optional like the certificate, because it is only
      # produced when the C++ tools are present to supply mspdbcmf.exe.
      # Windows App SDK 1.x tooling named it .msixsym; the standalone MSIX tooling that
      # ships with 2.x (Microsoft.Windows.SDK.BuildTools.MSIX) always writes .appxsym.
      - name: Find symbol package
        id: symbols
        shell: bash
        run: |
          SYM=$(find dist/ -type f \( -name "*.appxsym" -o -name "*.msixsym" \) | head -1)
          if [ -n "$SYM" ]; then
            echo "sym_path=$SYM" >> "$GITHUB_OUTPUT"
            echo "sym_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No symbol package found; the release will not carry one"
            echo "sym_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: msix-sideload
          path: ${{ steps.artifact.outputs.msix_path }}

      - name: Upload symbol package artifact
        if: steps.symbols.outputs.sym_found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: msix-symbols
          path: ${{ steps.symbols.outputs.sym_path }}

      - name: Upload certificate artifact
        if: steps.cert.outputs.cer_found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: msix-certificate
          path: ${{ steps.cert.outputs.cer_path }}

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag_version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download sideload MSIX
        uses: actions/download-artifact@v8
        with:
          name: msix-sideload
          path: artifacts/

      - name: Download certificate
        uses: actions/download-artifact@v8
        with:
          name: msix-certificate
          path: artifacts/
        continue-on-error: true

      - name: Download symbol package
        uses: actions/download-artifact@v8
        with:
          name: msix-symbols
          path: artifacts/
        continue-on-error: true

      # The certificate filename is read from the downloaded artifact instead of being
      # rebuilt from the tag. Constructing it meant hardcoding a trailing ".0" to pad
      # 3-part tags (v1.8.0) up to the 4-part MSIX version, which then produced a
      # bogus 5-part name once tags became 4-part (v1.9.0.0 -> 1.9.0.0.0). The artifact
      # is the single source of truth, so the two can no longer drift apart.
      - name: Compose release notes
        run: |
          CER_NAME=$(find artifacts -maxdepth 1 -name '*.cer' -printf '%f\n' | head -1)
          SYM_NAME=$(find artifacts -maxdepth 1 \( -name '*.appxsym' -o -name '*.msixsym' \) -printf '%f\n' | head -1)

          cat > release-body.md <<'EOF'
          ## Installation

          ### Microsoft Store (recommended)
          Search for **WhisperShroom** in the Microsoft Store or visit the [Store page](https://apps.microsoft.com/detail/9MX4RZGVCZMJ).

          ### Sideload (manual)
          EOF

          if [ -n "$CER_NAME" ]; then
            cat >> release-body.md <<'EOF'

          **Step 1: Install the certificate (one-time setup)**

          Download `__CER_NAME__` and run this command in an **Admin PowerShell**:

          ```powershell
          Import-Certificate -FilePath "$HOME\Downloads\__CER_NAME__" -CertStoreLocation "Cert:\LocalMachine\TrustedPeople"
          ```

          **Step 2: Install the app**
          EOF
            sed -i "s|__CER_NAME__|${CER_NAME}|g" release-body.md
          fi

          cat >> release-body.md <<'EOF'

          Download the `.msix` file and double-click to install.

          > **Note:** The certificate only needs to be installed once. Future updates can be installed by just downloading the new `.msix`.
          EOF

          if [ -n "$SYM_NAME" ]; then
            cat >> release-body.md <<'EOF'

          ### Debug symbols

          `__SYM_NAME__` contains the PDBs for this build. It is not needed to run the app; it is used to resolve stack traces from crash reports and for Store submissions.
          EOF
            sed -i "s|__SYM_NAME__|${SYM_NAME}|g" release-body.md
          fi

          echo "--- composed release body ---"
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: WhisperShroom v${{ steps.version.outputs.tag_version }}
          generate_release_notes: true
          body_path: release-body.md
          files: |
            artifacts/*
